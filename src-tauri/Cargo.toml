[package]
name = "songwriter-studio"
version = "0.1.0"
description = "Songwriter Studio desktop application"
authors = ["Donald Stancomb"]
edition = "2021"

[lib]
name = "songwriter_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
